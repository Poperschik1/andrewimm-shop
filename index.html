<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>andrewimm_shop</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: var(--tg-theme-bg-color, #0f0f12);
            --text: var(--tg-theme-text-color, #f4f4f5);
            --hint: var(--tg-theme-hint-color, #a1a1aa);
            --card: var(--tg-theme-secondary-bg-color, #18181b);
            --accent: var(--tg-theme-button-color, #7c3aed);
            --accent-text: var(--tg-theme-button-text-color, #fff);
            --border: color-mix(in srgb, var(--text) 12%, transparent);
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: 'Inter', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            padding: 16px 16px 110px;
            min-height: 100vh;
        }
        .hero { text-align: center; padding: 8px 0 16px; }
        .badge {
            display: inline-block;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: var(--accent-text);
            background: linear-gradient(135deg, var(--accent), #a855f7);
            padding: 4px 10px;
            border-radius: 999px;
            margin-bottom: 10px;
        }
        .hero h1 {
            margin: 0;
            font-size: 26px;
            font-weight: 700;
        }
        .hero p { margin: 8px 0 0; font-size: 13px; color: var(--hint); line-height: 1.5; }
        .cats {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 12px;
            scrollbar-width: none;
        }
        .cats::-webkit-scrollbar { display: none; }
        .cat-btn {
            flex-shrink: 0;
            border: 1px solid var(--border);
            background: var(--card);
            color: var(--text);
            padding: 8px 14px;
            border-radius: 999px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        }
        .cat-btn.active {
            background: var(--accent);
            color: var(--accent-text);
            border-color: transparent;
        }
        .product-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 12px;
        }
        .product-top { display: flex; gap: 12px; align-items: flex-start; }
        .product-icon {
            width: 44px; height: 44px; border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            font-size: 22px;
            background: color-mix(in srgb, var(--accent) 18%, transparent);
            flex-shrink: 0;
        }
        .product-title { font-size: 16px; font-weight: 600; line-height: 1.3; }
        .product-desc { font-size: 13px; color: var(--hint); line-height: 1.45; margin: 10px 0 14px; }
        .product-footer { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
        .price { font-size: 14px; font-weight: 700; color: var(--accent); line-height: 1.3; }
        .counter {
            display: flex; align-items: center;
            background: color-mix(in srgb, var(--text) 6%, transparent);
            border-radius: 12px; padding: 4px;
        }
        .counter button {
            width: 36px; height: 36px; border: none; border-radius: 10px;
            background: color-mix(in srgb, var(--accent) 25%, transparent);
            color: var(--accent); font-size: 20px; font-weight: 600; cursor: pointer;
        }
        .counter span { min-width: 28px; text-align: center; font-weight: 700; }
        .cart-bar {
            position: fixed; left: 0; right: 0; bottom: 0;
            padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px));
            background: color-mix(in srgb, var(--card) 95%, transparent);
            backdrop-filter: blur(12px);
            border-top: 1px solid var(--border);
        }
        .cart-total-label { font-size: 12px; color: var(--hint); }
        .cart-total-value { font-size: 15px; font-weight: 700; line-height: 1.4; }
        .loading, .error { text-align: center; color: var(--hint); padding: 40px 16px; }
        .empty { text-align: center; color: var(--hint); padding: 24px; font-size: 14px; }
    </style>
</head>
<body>
    <div class="hero">
        <span class="badge">Эксклюзивный магазин</span>
        <h1 id="shop-name">andrewimm_shop</h1>
        <p id="shop-tagline">Загрузка…</p>
    </div>
    <div class="cats" id="categories"></div>
    <div id="products"><p class="loading">Загрузка каталога…</p></div>
    <div class="cart-bar">
        <div class="cart-total-label">Итого</div>
        <div class="cart-total-value" id="cart-total">0 ⭐</div>
    </div>
    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        const CATALOG_URL = new URL('catalog.json', window.location.href).href;
        let catalog = null;
        let activeCategory = 'all';
        const order = {};

        async function loadCatalog() {
            try {
                const res = await fetch(CATALOG_URL, { cache: 'no-store' });
                if (!res.ok) throw new Error('catalog fetch failed');
                catalog = await res.json();
                document.getElementById('shop-name').textContent = catalog.shop_name || 'Shop';
                document.getElementById('shop-tagline').textContent =
                    catalog.tagline || '⭐ Stars · 💳 карта · 🪙 USDT';
                catalog.products.forEach(p => { order[p.id] = 0; });
                renderCategories();
                renderProducts();
                updateUI();
            } catch (e) {
                document.getElementById('products').innerHTML =
                    '<p class="error">Не удалось загрузить каталог.<br>Обновите страницу.</p>';
            }
        }

        function renderCategories() {
            const el = document.getElementById('categories');
            const cats = catalog.categories || [];
            el.innerHTML = '';
            const allBtn = document.createElement('button');
            allBtn.className = 'cat-btn active';
            allBtn.textContent = '🏪 Все';
            allBtn.onclick = () => setCategory('all');
            el.appendChild(allBtn);
            cats.forEach(c => {
                const btn = document.createElement('button');
                btn.className = 'cat-btn';
                btn.textContent = `${c.icon} ${c.name}`;
                btn.dataset.id = c.id;
                btn.onclick = () => setCategory(c.id);
                el.appendChild(btn);
            });
        }

        function setCategory(id) {
            activeCategory = id;
            document.querySelectorAll('.cat-btn').forEach(btn => {
                const bid = btn.dataset.id || 'all';
                btn.classList.toggle('active', (id === 'all' && !btn.dataset.id) || bid === id);
            });
            renderProducts();
        }

        function renderProducts() {
            const wrap = document.getElementById('products');
            const list = (catalog.products || []).filter(p =>
                activeCategory === 'all' || p.category === activeCategory
            );
            if (!list.length) {
                wrap.innerHTML = '<p class="empty">В этой категории пока нет товаров</p>';
                return;
            }
            wrap.innerHTML = list.map(p => `
                <div class="product-card" data-id="${p.id}">
                    <div class="product-top">
                        <div class="product-icon">${p.icon || '📦'}</div>
                        <div class="product-title">${p.title}</div>
                    </div>
                    <div class="product-desc">${p.description}</div>
                    <div class="product-footer">
                        <div class="price">${p.price_stars} ⭐<br>${p.price_rub} ₽</div>
                        <div class="counter">
                            <button type="button" data-action="minus" data-item="${p.id}">−</button>
                            <span id="${p.id}-qty">0</span>
                            <button type="button" data-action="plus" data-item="${p.id}">+</button>
                        </div>
                    </div>
                </div>
            `).join('');
            wrap.querySelectorAll('.counter button').forEach(btn => {
                btn.addEventListener('click', () => {
                    const item = btn.dataset.item;
                    const delta = btn.dataset.action === 'plus' ? 1 : -1;
                    order[item] = Math.max(0, (order[item] || 0) + delta);
                    if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
                    updateUI();
                });
            });
        }

        function getTotals() {
            if (!catalog) return { stars: 0, rub: 0, usdt: 0 };
            return catalog.products.reduce((acc, p) => {
                const q = order[p.id] || 0;
                acc.stars += q * p.price_stars;
                acc.rub += q * p.price_rub;
                acc.usdt += q * p.price_usdt;
                return acc;
            }, { stars: 0, rub: 0, usdt: 0 });
        }

        function updateUI() {
            if (!catalog) return;
            catalog.products.forEach(p => {
                const el = document.getElementById(`${p.id}-qty`);
                if (el) el.textContent = order[p.id] || 0;
            });
            const t = getTotals();
            document.getElementById('cart-total').innerHTML =
                `${t.stars} ⭐<br>${t.rub} ₽ · ${t.usdt.toFixed(2)} USDT`;
            if (t.stars > 0) {
                tg.MainButton.setText('Оформить заказ');
                tg.MainButton.show();
            } else {
                tg.MainButton.hide();
            }
        }

        function sendDataToBot() {
            if (getTotals().stars === 0) {
                tg.showAlert('Добавьте товары кнопкой «+»');
                return;
            }
            if (!tg.sendData) {
                tg.showAlert('Откройте магазин через кнопку бота');
                return;
            }
            tg.MainButton.showProgress();
            tg.sendData(JSON.stringify(order));
            tg.close();
        }

        tg.MainButton.onClick(sendDataToBot);
        tg.MainButton.color = tg.themeParams.button_color || '#7c3aed';
        tg.MainButton.textColor = tg.themeParams.button_text_color || '#ffffff';
        tg.MainButton.hide();
        loadCatalog();
    </script>
</body>
</html>
